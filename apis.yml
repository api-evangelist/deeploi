name: Deeploi
description: 'Deeploi (deeploi GmbH) is a Berlin-based all-in-one IT management (ITSM)
  platform for mid-sized businesses and startups, primarily across the DACH region.
  It centralizes employee onboarding and offboarding, device and inventory management,
  software and license/account administration, cybersecurity and compliance policies,
  and unlimited expert IT support in a single dashboard priced per active employee.
  Deeploi operates an Information Security Management System aligned with ISO/IEC 27001
  and is GDPR compliant, publishing its posture through a Kertos-powered Trust Center.
  The company is backed by Atomico. Deeploi does not currently publish a public developer
  API; this profile captures its identity, security posture, and public web properties.'
